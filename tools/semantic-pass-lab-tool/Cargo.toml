[package]
name = "semantic-pass-lab-tool"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.17", features = ["v4"] }
writing-assist-core = { path = "../../crates/core" }
writing-assist-index = { path = "../../crates/index" }
