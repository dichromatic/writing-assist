[workspace]
members = ["src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["rumi"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
